name: CyberShield CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND VERIFICATION (Next.js & TypeScript)
  # ----------------------------------------------------------------------------
  frontend-check:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Production Next.js Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ----------------------------------------------------------------------------
  # 2. BACKEND VERIFICATION (FastAPI, Pytest & Linters)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Pytest Suite & Linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with Flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: development
          DEBUG: "True"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # 3. DOCKER CONTAINER BUILD VERIFICATION
  # ----------------------------------------------------------------------------
  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cybershield-api:ci-test

      - name: Build Web Dashboard Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: cybershield-web:ci-test
