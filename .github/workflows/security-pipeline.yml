name: CyberShield Continuous Security Validation & Pentesting Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly continuous security assurance suite at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. APPLICATION & DEPENDENCY AUDIT
  # ----------------------------------------------------------------------------
  supply-chain-and-secrets:
    name: Secrets & Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r backend/requirements.txt

      - name: Run pip-audit (Python Supply Chain)
        run: |
          pip-audit --desc on --format json --output pip-audit-results.json || true
        continue-on-error: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Run Audit
        run: |
          npm ci || npm install
          npm audit --audit-level=high --json > npm-audit-results.json || true
        continue-on-error: true

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ----------------------------------------------------------------------------
  # 2. AUTOMATED BACKEND REGRESSION & SECURITY PENETRATION TESTS
  # ----------------------------------------------------------------------------
  security-validation-suite:
    name: Automated Security Tests & OWASP Probes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Sprint 19 Security Validation Suite
        working-directory: backend
        run: |
          python -m pytest tests/test_sprint19_security_validation.py -v --tb=short

      - name: Run Full Sprints 1–19 Regression Suite
        working-directory: backend
        run: |
          python -m pytest -q

  # ----------------------------------------------------------------------------
  # 3. CONTAINER IMAGE & DOCKER BENCHMARK AUDITING
  # ----------------------------------------------------------------------------
  container-security-audit:
    name: Container Security & CIS Hardening Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t cybershield-backend:ci backend/

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cybershield-backend:ci'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
