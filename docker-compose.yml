services:
  # 1. FastAPI Security Gateway
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PROJECT_NAME=CyberShield Security API
      - API_V1_STR=/api/v1
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-your-anon-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Redis Message Broker & State Store (Internal Network Only)
  redis:
    image: redis:7-alpine
    container_name: cybershield-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - cybershield-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. Celery Asynchronous Assessment Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-c", "4"]
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-your-anon-key}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cybershield-net

networks:
  cybershield-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
