version: "3.8"

services:
  # 1. Next.js SOC Dashboard (Frontend)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cybershield-web-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.cybershield.corp.internal/api/v1
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - cybershield-frontend-net
      - cybershield-backend-net

  # 2. FastAPI Enterprise REST Gateway (Backend)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PROJECT_NAME=CyberShield Security API
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=https://cybershield.corp.internal,https://app.cybershield.io
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - RATE_LIMIT_ENABLED=True
      - SECURITY_HEADERS_ENABLED=True
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cybershield-backend-net
      - cybershield-internal-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. Hardened Redis State Store & Task Broker
  redis:
    image: redis:7.2-alpine
    container_name: cybershield-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - redis_prod_data:/data
    networks:
      - cybershield-internal-net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 4. Celery Asynchronous Assessment Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-worker-prod
    restart: always
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "warning", "-c", "4", "--max-tasks-per-child", "100"]
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cybershield-internal-net

networks:
  cybershield-frontend-net:
    driver: bridge
  cybershield-backend-net:
    driver: bridge
  cybershield-internal-net:
    internal: true
    driver: bridge

volumes:
  redis_prod_data:
    driver: local
